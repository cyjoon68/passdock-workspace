services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: passdock
      POSTGRES_USER: passdock
      POSTGRES_PASSWORD: passdock
    ports:
      - "5433:5432"
  be:
    build: ./passdock-be
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/passdock
      DATABASE_USERNAME: passdock
      DATABASE_PASSWORD: passdock
      FLYWAY_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      - db
  fe:
    build: ./passdock-fe
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081/api
    ports:
      - "3001:3000"
    depends_on:
      - be
