services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: passdock
      POSTGRES_USER: passdock
      POSTGRES_PASSWORD: passdock
    ports:
      - "5433:5432"
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  prometheus:
    image: prom/prometheus:v3.8.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "3004:3000"
  be:
    build: ./passdock-be
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/passdock
      DATABASE_USERNAME: passdock
      DATABASE_PASSWORD: passdock
      FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      - db
      - kafka
  fe:
    build: ./passdock-fe
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:8081/api
    ports:
      - "3001:3000"
    depends_on:
      - be
